<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLARES IN TOWN</title>
<meta name="description" content="Live recordings from Clare's In Town, 2022–2025.">
<meta name="theme-color" content="#121110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: full-bleed film photo; a dark "stage-left" rail holds title, search, gig filters and the DISCO player.
     Phone: the photo becomes a short hero and the rail becomes the page below it. */
  :root {
    --ink: #121110;          /* rail base, warm near-black from the photo's shadows */
    --ink-2: #1c1a18;        /* raised surfaces: search field, dropdown */
    --line: rgba(255, 244, 230, 0.10);
    --paper: #f4efe7;        /* film-white text */
    --muted: rgba(244, 239, 231, 0.58);
    --red: #e5412d;          /* the tongue on the backdrop */
    --display: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
    --body: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --rail: clamp(360px, 33.333vw, 560px);
    --fade: 160px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--paper); font: 15px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* the photo sits to the right of the rail, with a soft fade into it */
  .photo {
    position: fixed; top: 0; bottom: 0; right: 0; left: calc(var(--rail) - var(--fade));
    background: var(--ink) url("bg.jpg") 55% 40% / cover no-repeat;
  }
  .photo::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: var(--fade);
    background: linear-gradient(90deg, var(--ink), rgba(18,17,16,0));
  }

  .rail {
    position: fixed; inset: 0 auto 0 0; width: var(--rail); z-index: 2;
    display: flex; flex-direction: column; gap: 16px;
    padding: max(28px, env(safe-area-inset-top)) 24px max(18px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
  }
  header { display: grid; gap: 10px; }
  h1 {
    font-family: var(--display); font-weight: 900; font-stretch: 125%;
    font-size: clamp(34px, 3vw, 50px); line-height: 0.92; letter-spacing: -0.01em; text-transform: uppercase;
    text-wrap: balance;
  }
  .meta { font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta b { color: var(--red); font-weight: 600; }

  .search { position: relative; }
  .search input {
    width: 100%; height: 44px; padding: 0 14px 0 40px;
    font: 500 15px var(--body); color: var(--paper);
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; outline: none;
    transition: border-color .15s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--red); }
  .search svg { position: absolute; left: 13px; top: 13px; width: 18px; height: 18px; stroke: var(--muted); pointer-events: none; }
  .results {
    position: absolute; left: 0; right: 0; top: 50px; z-index: 5; max-height: min(60vh, 520px); overflow-y: auto;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
  }
  .results a { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1px 12px; padding: 10px 14px; color: inherit; text-decoration: none; border-top: 1px solid var(--line); }
  .results a:hover, .results a:focus-visible { background: rgba(229, 65, 45, 0.14); outline: none; }
  .results .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; grid-row: span 2; }
  .results .g { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results .hint, .results .none { padding: 9px 14px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .gigs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: -4px; padding-bottom: 2px; }
  .gigs::-webkit-scrollbar { display: none; }
  .gigs button {
    flex: none; height: 28px; padding: 0 11px; border-radius: 999px; cursor: pointer;
    font: 500 12px var(--body); color: var(--paper); background: transparent; border: 1px solid var(--line);
    transition: border-color .15s, background .15s;
  }
  .gigs button:hover { border-color: rgba(244,239,231,.35); }
  .gigs button[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
  .gigs button:focus-visible, .search input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .player { flex: 1; min-height: 300px; border-radius: 12px; overflow: hidden; background: #222; border: 1px solid var(--line); }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  footer { font-size: 11px; color: var(--muted); letter-spacing: .04em; }

  /* Phone: photo hero on top, rail becomes the page */
  @media (max-width: 760px) {
    body { overflow: auto; }
    .photo { position: relative; left: 0; height: 52vh; min-height: 300px; background-position: 50% 42%; }
    .photo::after { inset: auto 0 0 0; width: auto; height: 50%; background: linear-gradient(0deg, var(--ink), rgba(18,17,16,0)); }
    .rail { position: relative; inset: auto; width: auto; margin-top: -84px;
            padding: 0 max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    h1 { font-size: clamp(32px, 10vw, 46px); }
    .player { flex: none; height: 74vh; min-height: 460px; }
    .results { max-height: 55vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="photo" role="img" aria-label="Clare's In Town stacked in a totem pole in front of the stage"></div>

  <main class="rail">
    <header>
      <h1>CLARES IN TOWN</h1>
      <p class="meta" id="meta">Live recordings</p>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search a song or gig" autocomplete="off" aria-label="Search songs or gigs" aria-controls="results">
      <div class="results" id="results" hidden></div>
    </div>

    <div class="gigs" id="gigs" aria-label="Filter by gig"></div>

    <div class="player"><iframe id="disco" title="Clares in Town on DISCO" allow="autoplay; fullscreen"></iframe></div>
    <footer>Streaming via DISCO</footer>
  </main>

<script src="disco.js"></script>
<script src="tracks.js"></script>
<script>
  document.getElementById('disco').src = DISCO_EMBED;
  const q = document.getElementById('q'), res = document.getElementById('results'), gigsEl = document.getElementById('gigs');
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const gigOf = t => t.gig.replace(/ - \d+$/, '').replace(/ \(full set\)$/, '');
  const yearOf = g => +(g.match(/\d{4}/) || [0])[0];

  const gigs = [...new Set(TRACKS.map(gigOf))].sort((a, b) => yearOf(a) - yearOf(b) || a.localeCompare(b));
  const years = gigs.map(yearOf).filter(Boolean);
  const mins = Math.round(TRACKS.reduce((s, t) => s + t.dur, 0) / 60);
  document.getElementById('meta').innerHTML =
    `<b>${TRACKS.length}</b> live tracks · ${gigs.length} gigs · ${Math.min(...years)}–${Math.max(...years)} · ${Math.floor(mins / 60)} h ${mins % 60} m`;

  let activeGig = null;
  gigsEl.innerHTML = gigs.map(g => `<button type="button" aria-pressed="false" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  gigsEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    activeGig = activeGig === b.dataset.g ? null : b.dataset.g;
    gigsEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.g === activeGig));
    render();
  });

  function render() {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length && !activeGig) { res.hidden = true; return; }
    const hits = TRACKS.filter(t => (!activeGig || gigOf(t) === activeGig) &&
      words.every(w => (t.title + ' ' + t.gig).toLowerCase().includes(w)));
    res.innerHTML = hits.length
      ? `<div class="hint">${hits.length} track${hits.length > 1 ? 's' : ''} · opens in DISCO</div>` + hits.map(t =>
          `<a href="${esc(t.src)}" target="_blank" rel="noopener"><span class="t">${esc(t.title)}</span><span class="d">${fmt(t.dur)}</span><span class="g">${esc(t.gig)}</span></a>`).join('')
      : '<div class="none">No tracks match</div>';
    res.hidden = false;
  }
  q.addEventListener('input', render);
  q.addEventListener('focus', render);
  q.addEventListener('keydown', e => { if (e.key === 'Escape') { res.hidden = true; q.blur(); } });
  document.addEventListener('click', e => { if (!e.target.closest('.search, .gigs')) res.hidden = true; });
</script>
</body>
</html>
